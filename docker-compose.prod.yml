# Production: single backend image serves API + built frontend on port 8000.
# TLS is expected in front of this service (company proxy). Set SESSION_COOKIE_SECURE=true
# when the browser sees HTTPS, or use an https:// OIDC_REDIRECT_URL.
#
# Application secrets and DATABASE_URL load from AWS Secrets Manager when
# /run/x-locale/secrets-arn is mounted (see .env.example). Other settings use env vars.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xlocale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: xlocale
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlocale -d xlocale"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-16000}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      AI_TRANSLATE_BATCH_SIZE: ${AI_TRANSLATE_BATCH_SIZE:-20}
      AI_TRANSLATE_MAX_WORKERS: ${AI_TRANSLATE_MAX_WORKERS:-5}
      DEFAULT_BASE_LANGUAGE: ${DEFAULT_BASE_LANGUAGE:-vi}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://login.microsoftonline.com/common/v2.0}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-http://localhost:8000/api/auth/callback}
      STATIC_DIR: static
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    volumes:
      - ${X_LOCALE_SECRETS_ARN_FILE:?set X_LOCALE_SECRETS_ARN_FILE}:/run/x-locale/secrets-arn:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
