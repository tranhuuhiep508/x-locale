# Production: single backend image serves API + built frontend on port 8000.
# TLS is expected in front of this service (company proxy). Set SESSION_COOKIE_SECURE=true
# when the browser sees HTTPS, or use an https:// OIDC_REDIRECT_URL.
#
# Application settings use Pydantic precedence: env overrides AWS, then defaults.
# Secret DATABASE_URL must be
# postgresql+psycopg://xlocale:<POSTGRES_PASSWORD>@postgres:5432/xlocale
# with the same password as POSTGRES_PASSWORD.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xlocale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: xlocale
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlocale -d xlocale"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      - SECRET_ENABLE=${SECRET_ENABLE:-false}
      - X_LOCALE_AWS_SECRET_ID
      - AUTH_DEV_BYPASS=${AUTH_DEV_BYPASS:-false}
      - STATIC_DIR=static
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      # Bare entries are omitted when unset; explicit empty overrides stay empty.
      - AWS_DEFAULT_REGION
      - AWS_PROFILE
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - DATABASE_URL
      - X_LOCALE_SECRET
      - X_LOCALE_DEMO_API_KEY
      - ENV
      - AWS_REGION
      - OPENAI_API_KEY
      - OPENAI_MODEL
      - OPENAI_BASE_URL
      - OPENAI_MAX_OUTPUT_TOKENS
      - OPENAI_REASONING_EFFORT
      - AI_TRANSLATE_BATCH_SIZE
      - AI_TRANSLATE_MAX_WORKERS
      - AI_TRANSLATE_STUB
      - AI_TRANSLATE_STUB_DELAY_MS
      - DEFAULT_BASE_LANGUAGE
      - SESSION_COOKIE_SECURE
      - OIDC_ISSUER
      - OIDC_CLIENT_ID
      - OIDC_CLIENT_SECRET
      - OIDC_SCOPES
      - OIDC_REDIRECT_URL
      - IMPORT_ASYNC_THRESHOLD
      - ACTIVITY_RETENTION_DAYS
      - CORS_ORIGINS
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
