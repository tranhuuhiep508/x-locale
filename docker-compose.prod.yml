# Production: single backend serves API + built frontend (no separate frontend container, no CORS).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tms
      POSTGRES_PASSWORD: tms
      POSTGRES_DB: tms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms -d tms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
      args:
        VITE_API_KEY: ${TMS_DEMO_API_KEY:-demo-api-key-change-me}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tms:tms@postgres:5432/tms
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-us.amazon.nova-2-lite-v1:0}
      TMS_SECRET: ${TMS_SECRET:-dev-secret-change-me}
      TMS_DEMO_API_KEY: ${TMS_DEMO_API_KEY:-demo-api-key-change-me}
      STATIC_DIR: static
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
