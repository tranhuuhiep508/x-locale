# Default: local dev with Vite HMR frontend + hot-reload backend.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xlocale
      POSTGRES_PASSWORD: xlocale
      POSTGRES_DB: xlocale
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlocale -d xlocale"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://xlocale:xlocale@postgres:5432/xlocale
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-16000}
      AI_TRANSLATE_BATCH_SIZE: ${AI_TRANSLATE_BATCH_SIZE:-20}
      AI_TRANSLATE_MAX_WORKERS: ${AI_TRANSLATE_MAX_WORKERS:-5}
      X_LOCALE_SECRET: ${X_LOCALE_SECRET:-change-me}
      X_LOCALE_DEMO_API_KEY: ${X_LOCALE_DEMO_API_KEY:-demo-local-key}
      DEFAULT_BASE_LANGUAGE: ${DEFAULT_BASE_LANGUAGE:-vi}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-http://localhost:5173/api/auth/callback}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.cli seed-demo &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
