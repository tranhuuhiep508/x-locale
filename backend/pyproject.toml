[project]
name = "x-locale-backend"
version = "0.2.0"
description = "x-locale FastAPI backend"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.140",
  "uvicorn[standard]>=0.51.0",
  "sqlalchemy>=2.0.51",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.3.4",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "boto3>=1.43.57",
  "aws-bedrock-token-generator>=1.1.0",
  "python-multipart>=0.0.32",
  "authlib>=1.4.0",
  "pyjwt>=2.10.0",
  "itsdangerous>=2.2.0",
  "httpx>=0.28.0",
  "openpyxl>=3.1.5",
  "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[project.scripts]
x-locale-backend = "app.cli:app"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "UP037", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
