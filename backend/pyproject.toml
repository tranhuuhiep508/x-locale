[project]
name = "tms-backend"
version = "0.1.0"
description = "TMS FastAPI backend"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.140",
  "uvicorn[standard]>=0.51.0",
  "sqlalchemy>=2.0.51",
  "psycopg[binary]>=3.3.4",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "boto3>=1.43.57",
  "python-multipart>=0.0.32",
]

[tool.fastapi]
entrypoint = "app.main:app"
