[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x-locale-cli"
version = "0.1.0"
description = "CLI for x-locale translation sync (locale init | push | pull)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["i18n", "l10n", "translation", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Internationalization",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
locale = "x_locale_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["x_locale_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "e2e: CLI end-to-end tests against a live x-locale API",
]

[tool.setuptools.package-data]
x_locale_cli = ["locale.cmd"]
