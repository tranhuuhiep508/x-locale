[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tms-cli"
version = "0.1.0"
description = "CLI for TMS translation sync"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.scripts]
tms = "tms_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tms_cli*"]
