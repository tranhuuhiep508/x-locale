[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tms-cli"
version = "0.1.0"
description = "CLI for TMS translation sync (tms init | push | pull)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["i18n", "l10n", "translation", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Internationalization",
]
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.scripts]
tms = "tms_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["tms_cli*"]

[tool.setuptools.package-data]
tms_cli = ["tms.cmd"]
