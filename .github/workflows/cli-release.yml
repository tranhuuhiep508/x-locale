name: CLI release

# Publishes standalone `loc` binaries as a GitHub Release `cli-v<version>`, where
# <version> is `__version__` in cli/x_locale_cli/__init__.py.
#  - Push to develop/master that bumps the version: builds and releases it
#    (skipped when that release already exists).
#  - Push a tag `cli-v<version>`: same, for that exact commit.
#  - Pull request touching the CLI, or run manually (workflow_dispatch): builds and
#    smoke-tests binaries as workflow artifacts only.
on:
  pull_request:
    paths:
      - cli/**
      - .github/workflows/cli-release.yml
  push:
    branches: [develop, master]
    paths:
      - cli/x_locale_cli/__init__.py
      - .github/workflows/cli-release.yml
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize releases; let newer PR pushes cancel older PR builds.
  group: cli-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build with uv's standalone CPython (targets old glibc/macOS), never the runner's.
  UV_PYTHON: '3.13'
  # Pinned so every platform builds a release with the same uv.
  UV_VERSION: '0.13.4'
  UV_PYTHON_PREFERENCE: only-managed
  NO_COLOR: '1'

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' cli/x_locale_cli/__init__.py)
          test -n "$version" || { echo "::error::__version__ not found"; exit 1; }
          tag="cli-v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" != push ]; then
            release=false
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            test "${GITHUB_REF_NAME}" = "${tag}" || {
              echo "::error::tag ${GITHUB_REF_NAME} does not match cli version ${version}"; exit 1; }
            release=true
          elif gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            release=skip
          else
            release=true
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag} release=${release}"

  build:
    name: build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.release != 'skip'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, manylinux: quay.io/pypa/manylinux_2_28_x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, manylinux: quay.io/pypa/manylinux_2_28_aarch64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: macos-15, target: macos-arm64 }
    defaults:
      run:
        shell: bash
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run CLI unit tests
        run: uv run --extra dev pytest tests -m "not e2e"

      - name: Build and smoke-test binary
        if: ${{ !matrix.manylinux }}
        run: uv run --group build python packaging/build_binary.py

      # PyInstaller bundles system libraries (e.g. libgcc_s) from the build host,
      # so build Linux binaries on glibc 2.28 to keep them runnable on older distros.
      - name: Build and smoke-test binary (manylinux_2_28)
        if: ${{ matrix.manylinux }}
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/w" -w /w/cli \
            -e UV_VERSION -e UV_PYTHON -e UV_PYTHON_PREFERENCE -e NO_COLOR -e UV_PROJECT_ENVIRONMENT=/tmp/build-venv \
            "${{ matrix.manylinux }}" \
            sh -c 'curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh && "$HOME/.local/bin/uv" run --group build python packaging/build_binary.py'

      - name: Run on a clean glibc 2.28 distro (AlmaLinux 8)
        if: ${{ matrix.manylinux }}
        run: |
          docker run --rm -v "$PWD/dist:/dist" almalinux:8 \
            sh -c '/dist/loc-${{ matrix.target }} --version && /dist/loc-${{ matrix.target }} --help >/dev/null'

      - uses: actions/upload-artifact@v4
        with:
          name: loc-${{ matrix.target }}
          path: cli/dist/loc-${{ matrix.target }}*
          if-no-files-found: error

  release:
    name: publish release
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: loc-*
          merge-multiple: true

      - name: Write checksums and add install scripts
        run: |
          (cd dist && sha256sum loc-* > SHA256SUMS && cat SHA256SUMS)
          cp cli/install.sh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Creates the tag at this commit when it does not exist yet.
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "CLI ${TAG#cli-}" \
            --generate-notes
