name: CLI release

# Push a tag like `cli-v0.2.0` (matching cli/x_locale_cli/__init__.py) to build
# standalone `loc` binaries and publish them as a GitHub Release.
# Run manually (workflow_dispatch) to build binaries as workflow artifacts only.
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Build with uv's standalone CPython (targets old glibc/macOS), never the runner's.
  UV_PYTHON: '3.13'
  UV_PYTHON_PREFERENCE: only-managed
  NO_COLOR: '1'

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, compat: quay.io/pypa/manylinux_2_28_x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64, compat: quay.io/pypa/manylinux_2_28_aarch64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: windows-latest, target: windows-x64 }
    defaults:
      run:
        shell: bash
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches CLI version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run python -c 'import x_locale_cli; print(x_locale_cli.__version__)')
          test "${GITHUB_REF_NAME}" = "cli-v${version}" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match cli version ${version}"; exit 1; }

      - name: Run CLI unit tests
        run: uv run --extra dev pytest tests -m "not e2e"

      - name: Build and smoke-test binary
        run: uv run --group build python packaging/build_binary.py

      - name: Run on an old-glibc distro (glibc 2.28)
        if: matrix.compat
        run: |
          docker run --rm -v "$PWD/dist:/dist" "${{ matrix.compat }}" \
            sh -c '/dist/loc-${{ matrix.target }} --version && /dist/loc-${{ matrix.target }} --help >/dev/null'

      - uses: actions/upload-artifact@v4
        with:
          name: loc-${{ matrix.target }}
          path: cli/dist/loc-${{ matrix.target }}*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: loc-*
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum loc-* > SHA256SUMS && cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CLI ${GITHUB_REF_NAME#cli-}" \
            --generate-notes
