name: CLI E2E

on:
  pull_request:
  push:
    branches: [master]

jobs:
  cli-e2e:
    name: cli-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xlocale
          POSTGRES_PASSWORD: xlocale
          POSTGRES_DB: xlocale
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U xlocale -d xlocale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://xlocale:xlocale@localhost:5432/xlocale  # pragma: allowlist secret
      CLI_E2E_DATABASE_NAME: xlocale_cli_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Assert collation C
        env:
          PGPASSWORD: xlocale
        run: |
          # CI only. These reload-level settings are not used by Compose or production.
          psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync=off" \
            -c "ALTER SYSTEM SET synchronous_commit=off" \
            -c "ALTER SYSTEM SET full_page_writes=off" \
            -c "SELECT pg_reload_conf()"
          collate=$(psql -h localhost -U xlocale -d xlocale -Atqc "SELECT datcollate FROM pg_database WHERE datname = current_database()")
          echo "datcollate=${collate}"
          test "${collate}" = "C"

      - name: Install backend dependencies
        run: cd backend && uv sync --all-extras

      - name: Install CLI dependencies (with pytest)
        run: cd cli && uv sync --extra dev

      - name: Run CLI E2E ship-gate tests
        run: cd cli && uv run pytest tests/e2e -m e2e -v --tb=short
        env:
          CI: true

      - name: Drop the run database
        if: always()
        env:
          PGPASSWORD: xlocale
        run: |
          psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'xlocale_cli_${{ github.run_id }}_${{ github.run_attempt }}' AND pid <> pg_backend_pid()"
          psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS xlocale_cli_${{ github.run_id }}_${{ github.run_attempt }}"
