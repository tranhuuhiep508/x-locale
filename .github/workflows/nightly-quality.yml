name: Nightly quality

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  postgres-reliability-and-scale:
    name: postgres-reliability-and-scale
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: python:3.14-bookworm
      options: --cpus=4 --memory=8g
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xlocale
          POSTGRES_PASSWORD: xlocale-test
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U xlocale -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://xlocale:xlocale-test@postgres:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install backend dependencies
        run: cd backend && uv sync --all-extras
      - name: Run PostgreSQL concurrency and migration suite
        run: cd backend && uv run pytest tests/postgres -m postgres -q
      - name: Run 100k string benchmark
        run: cd backend && uv run python -m scripts.benchmark_scale --output ../benchmark-artifacts
      - name: Retain timing and memory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-scale
          path: benchmark-artifacts/
          if-no-files-found: warn

  browser-matrix:
    name: browser-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: |
          cd backend && uv sync --all-extras
          cd ../frontend && npm ci
          cd ../e2e && npm ci
      - name: Install browser engines and libraries
        run: cd e2e && npx playwright install --with-deps chromium firefox webkit
      - name: Run browser and keyboard smoke tests
        run: cd e2e && npm run test:nightly
        env:
          CI: true
      - name: Retain browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-browser-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
