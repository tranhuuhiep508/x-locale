name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  frontend:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: TypeScript typecheck
        run: cd frontend && npm run typecheck

      - name: ESLint check
        run: cd frontend && npm run lint

      - name: Run Vitest unit tests
        run: cd frontend && npx vitest run

      - name: Build frontend
        run: cd frontend && npm run build

  backend:
    name: backend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: cd backend && uv sync --all-extras

      - name: Lint with Ruff
        run: cd backend && uv run ruff check

      - name: Run pytest
        run: cd backend && uv run pytest

  backend-postgres:
    name: backend-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xlocale
          POSTGRES_PASSWORD: xlocale
          POSTGRES_DB: xlocale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xlocale -d xlocale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://xlocale:xlocale@localhost:5432/xlocale
      TEST_DATABASE_URL: postgresql+psycopg://xlocale:xlocale@localhost:5432/xlocale
      AUTH_DEV_BYPASS: "true"
      X_LOCALE_SECRET: test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install PostgreSQL 16 client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: cd backend && uv sync --all-extras

      - name: Apply migrations and check for drift
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run Postgres tests
        working-directory: backend
        run: uv run pytest -m postgres

  cli:
    name: cli-unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NO_COLOR: '1'
      FORCE_COLOR: '0'
      TERM: dumb

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: cd cli && uv sync --extra dev

      - name: Run CLI unit tests
        run: cd cli && uv run pytest tests -m "not e2e"
