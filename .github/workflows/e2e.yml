name: E2E

on:
  pull_request:
  push:
    branches: [master]

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xlocale
          POSTGRES_PASSWORD: xlocale
          POSTGRES_DB: xlocale
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xlocale -d xlocale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql+psycopg://xlocale:xlocale@localhost:5432/xlocale_e2e_${{ github.run_id }}_${{ github.run_attempt }}  # pragma: allowlist secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        run: cd backend && uv sync --all-extras

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Install OS libs from Ubuntu mirrors only. `playwright install --with-deps`
      # can fail when Google's chrome apt repo has a transient hash mismatch on GHA.
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Assert collation C and create the run database
        env:
          PGPASSWORD: xlocale
        run: |
          collate=$(psql -h localhost -U xlocale -d xlocale -Atqc "SELECT datcollate FROM pg_database WHERE datname = current_database()")
          echo "datcollate=${collate}"
          test "${collate}" = "C"
          psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE xlocale_e2e_${{ github.run_id }}_${{ github.run_attempt }} TEMPLATE template0"

      - name: Install Playwright OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2

      - name: Install Playwright browsers
        run: |
          cd e2e
          npm ci
          npx playwright install chromium

      - name: Run Playwright E2E
        run: cd e2e && npm test
        env:
          CI: true
          AI_TRANSLATE_STUB: true
          AI_TRANSLATE_STUB_DELAY_MS: 400

      - name: Drop the run database
        if: always()
        env:
          PGPASSWORD: xlocale
        run: |
          psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
            -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'xlocale_e2e_${{ github.run_id }}_${{ github.run_attempt }}' AND pid <> pg_backend_pid()"
          psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS xlocale_e2e_${{ github.run_id }}_${{ github.run_attempt }}"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
