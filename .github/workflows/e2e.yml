name: E2E

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a PR supersedes its previous run. Pushes to master always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each shard is its own runner with its own Postgres service, backend, and
    # frontend, so shards share nothing. Specs re-seed the Demo App or create
    # their own projects, so they do not depend on earlier specs.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xlocale
          POSTGRES_PASSWORD: xlocale
          POSTGRES_DB: xlocale
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U xlocale -d xlocale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://xlocale:xlocale@localhost:5432/xlocale  # pragma: allowlist secret
      TEST_DATABASE_URL: postgresql+psycopg://xlocale:xlocale@localhost:5432/xlocale_test  # pragma: allowlist secret
      E2E_DATABASE_URL: postgresql+psycopg://xlocale:xlocale@localhost:5432/xlocale_e2e_${{ github.run_id }}_${{ github.run_attempt }}  # pragma: allowlist secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            cli/uv.lock

      - name: Install backend dependencies
        run: cd backend && uv sync --all-extras

      - name: Install CLI dependencies
        run: cd cli && uv sync --locked

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # Install OS libs from Ubuntu mirrors only. `playwright install --with-deps`
      # can fail when Google's chrome apt repo has a transient hash mismatch on GHA.
      # One apt-get update covers the Playwright libs and, if the image lacks it, psql.
      - name: Install Playwright OS dependencies and PostgreSQL client
        run: |
          sudo apt-get update
          command -v psql || sudo apt-get install -y --no-install-recommends postgresql-client
          sudo apt-get install -y --no-install-recommends \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libx11-6 \
            libxcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2

      - name: Assert ICU en-US and create the test database
        env:
          PGPASSWORD: xlocale
        run: |
          # CI only. These reload-level settings are not used by Compose or production.
          psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync=off" \
            -c "ALTER SYSTEM SET synchronous_commit=off" \
            -c "ALTER SYSTEM SET full_page_writes=off" \
            -c "SELECT pg_reload_conf()"
          # The cluster is ICU en-US on purpose: Alpine (musl) libc locales sort by bytes like C,
          # so only ICU proves the app does not depend on a C database.
          provider=$(psql -h localhost -U xlocale -d xlocale -Atqc "SELECT datlocprovider::text || '|' || daticulocale FROM pg_database WHERE datname = current_database()")
          echo "provider=${provider}"
          test "${provider}" = "i|en-US"
          # xlocale_test is the bootstrap database. Playwright creates the suffixed database itself.
          psql -h localhost -U xlocale -d xlocale -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE xlocale_test TEMPLATE template0"

      - name: Install Playwright browsers
        run: |
          cd e2e
          npm ci
          npx playwright install chromium

      - name: Test the E2E database name guard
        if: matrix.shard == 1
        run: npm run test:database-url
        working-directory: e2e

      - name: Run Playwright E2E
        run: cd e2e && npm test -- --shard=${{ matrix.shard }}/4
        env:
          CI: true
          AI_TRANSLATE_STUB: true
          AI_TRANSLATE_STUB_DELAY_MS: 400

      - name: Drop the run database
        if: always()
        env:
          PGPASSWORD: xlocale
        run: |
          set -euo pipefail
          prefix="xlocale_e2e_${{ github.run_id }}_${{ github.run_attempt }}"
          like="$(printf '%s' "$prefix" | sed 's/_/\\_/g')\\_%"
          mapfile -t names < <(psql -h localhost -U xlocale -d postgres -Atqc \
            "SELECT datname FROM pg_database WHERE datname = '${prefix}' OR datname LIKE '${like}' ESCAPE '\\'")
          for name in "${names[@]}"; do
            [[ "$name" =~ ^[A-Za-z0-9_]+$ ]] || continue
            psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
              -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${name}' AND pid <> pg_backend_pid()"
            psql -h localhost -U xlocale -d postgres -v ON_ERROR_STOP=1 \
              -c "DROP DATABASE IF EXISTS \"${name}\""
          done

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Summary check for the master ruleset, which matches the exact name "e2e";
  # shards report "e2e (1/4)" etc. always() matters: a skipped required check
  # counts as passing.
  e2e-result:
    name: e2e
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.e2e.result }}" = success
